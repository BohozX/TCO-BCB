name: Actualizacion diaria TCO-BCB

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tco-bcb-daily
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar main.py
        id: correr
        run: |
          set +e
          python codigo/main.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Comprobar si hay cambios
        id: cambios
        run: |
          if [ -n "$(git status --porcelain datos estado)" ]; then
            echo "hay=1" >> "$GITHUB_OUTPUT"
          else
            echo "hay=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push
        if: steps.cambios.outputs.hay == '1'
        run: |
          git config user.name  "Daniel Bohoz Oros Trujillo"
          git config user.email "283808960+BohozX@users.noreply.github.com"
          git add datos estado
          git commit -m "Actualizacion BCB $(TZ=America/La_Paz date +'%Y-%m-%d')"
          git push

      - name: Propagar el resultado de main.py
        if: steps.correr.outputs.rc != '0'
        run: exit 1
