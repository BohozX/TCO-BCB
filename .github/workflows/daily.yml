name: Actualizacion diaria TCO-BCB

on:
  schedule:
    # UTC = 20:34, 22:14 y 23:49 del dia anterior en Bolivia.
    # Los intentos posteriores salen rapido si el corte diario ya esta completo.
    - cron: "34 0 * * *"
    - cron: "14 2 * * *"
    - cron: "49 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Procesar aunque el corte del dia ya este completo"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tco-bcb-daily
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Comprobar si el corte diario ya esta completo
        id: corte
        env:
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          if [ "$FORCE_RUN" = "true" ]; then
            echo "procesar=1" >> "$GITHUB_OUTPUT"
            echo "Ejecucion completa forzada manualmente."
          elif python codigo/verificar_corte_completo.py; then
            echo "procesar=0" >> "$GITHUB_OUTPUT"
            echo "El corte ya esta completo; no se repite el procesamiento."
          else
            echo "procesar=1" >> "$GITHUB_OUTPUT"
            echo "El corte aun no esta completo; se consulta y valida el BCB."
          fi

      - name: Instalar dependencias
        if: steps.corte.outputs.procesar == '1'
        run: pip install -r requirements.txt

      - name: Ejecutar main.py
        if: steps.corte.outputs.procesar == '1'
        id: correr
        run: |
          set +e
          python codigo/main.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Comprobar si hay cambios
        if: steps.corte.outputs.procesar == '1'
        id: cambios
        run: |
          if [ -n "$(git status --porcelain datos estado)" ]; then
            echo "hay=1" >> "$GITHUB_OUTPUT"
          else
            echo "hay=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push
        if: steps.corte.outputs.procesar == '1' && steps.cambios.outputs.hay == '1'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "Daniel Bohoz Oros Trujillo"
          git config user.email "283808960+BohozX@users.noreply.github.com"
          git add datos estado
          git commit -m "Actualizacion BCB $(TZ=America/La_Paz date +'%Y-%m-%d')"
          REMOTO="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git pull --rebase "$REMOTO" main
            if git push "$REMOTO" HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "No se pudo publicar la actualizacion despues de 3 intentos." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Propagar el resultado de main.py
        if: steps.corte.outputs.procesar == '1' && steps.correr.outputs.rc != '0'
        run: exit 1
